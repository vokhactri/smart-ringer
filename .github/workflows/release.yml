name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION_NAME: ${{ github.ref_name }}
      VERSION_CODE: ${{ github.run_number }}
      SIGNING_STORE_FILE: ${{ github.workspace }}/app/release.jks
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"

      - name: Test, lint, and build signed release APK
        run: ./gradlew test lintRelease assembleRelease

      - name: Prepare release files
        id: files
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          apk="dist/Smart-Ringer-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          (cd dist && shasum -a 256 "Smart-Ringer-${version}.apk" > "Smart-Ringer-${version}.apk.sha256")
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "checksum=$apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.files.outputs.apk }}#Smart Ringer APK" \
            "${{ steps.files.outputs.checksum }}#SHA-256 checksum" \
            --verify-tag \
            --generate-notes \
            --title "Smart Ringer ${GITHUB_REF_NAME#v}"
